<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASK SKA · SPV</title>
<link rel="manifest" href="spv-manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ea0029">
<link rel="stylesheet" href="style.css">
<style>.k{font-size:28px;font-weight:700;margin:0}.red{background:color-mix(in srgb,#dc2626 16%,var(--card));color:#dc2626}
h2{font-size:18px;margin:18px 0 8px}select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}</style>
</head><body><main>
<h1>ASK SKA · Monitor SPV</h1>
<input id="me" placeholder="Nama SPV (contoh: Budi)" style="margin-bottom:8px">
<select id="pl"></select>
<select id="pr"><option value="0">Hari ini</option><option value="7">7 hari terakhir</option><option value="30">30 hari terakhir</option></select>
<button class="btn" id="notif" style="margin:0 0 6px">🔔 Aktifkan notifikasi SPV</button>
<p class="s" id="nst" style="font-size:14px">Penilaian: Cepat = diambil dalam 1 menit, Normal = 1 sampai 3 menit, Lambat = lebih dari 3 menit.</p>
<div class="grid">
<div class="card"><div class="s" style="margin:0">Menunggu</div><p class="k" id="k1">0</p></div>
<div class="card"><div class="s" style="margin:0">Diproses</div><p class="k" id="k2">0</p></div>
<div class="card"><div class="s" style="margin:0">Selesai</div><p class="k" id="k3">0</p></div>
<div class="card"><div class="s" style="margin:0">Rata-rata respons</div><p class="k" id="k4">-</p></div>
<div class="card"><div class="s" style="margin:0">Cepat</div><p class="k" id="k5" style="color:var(--ok)">-</p></div>
<div class="card"><div class="s" style="margin:0">Lambat</div><p class="k" id="k6" style="color:#dc2626">0</p></div>
</div>
<h2>Sedang berjalan</h2><div id="act"></div>
<h2>Penilaian karyawan</h2><div id="kar"></div>
<h2>Per brand</h2><div class="card" id="brd"></div>
<h2>Riwayat terbaru</h2><div id="his"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="push.js"></script>
<script>
var CEPAT=1,LAMBAT=3; // batas menit penilaian
var db=supabase.createClient(CFG.url,CFG.key);
var $=function(x){return document.getElementById(x)};
var sel=localStorage.getItem("spv_pulau")||"all",per=localStorage.getItem("spv_per")||"0",brands={},pulaus={};
$("me").value=localStorage.getItem("spv_nama")||"";
function info(){return {nama:$("me").value.trim()||"SPV",peran:"spv",pulau:sel==="all"?null:sel,brand:null}}
$("me").onchange=function(){localStorage.setItem("spv_nama",$("me").value);segarkanPush(db,info())};
function mn(a,b){return (new Date(b)-new Date(a))/60000}
function f(n){return n.toFixed(1).replace(".",",")}
function avg(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null}
function nilai(m){return m<=CEPAT?["Cepat","tag g"]:m<=LAMBAT?["Normal","tag"]:["Lambat","tag red"]}
function resp(x){return x.diambil_pada?mn(x.dibuat,x.diambil_pada):mn(x.dibuat,new Date())}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function baris(a,b,tg,sub){var c=el("div","card"),t=el("div","row");t.appendChild(el("b","",a));if(tg)t.appendChild(tg);c.appendChild(t);
if(sub){var s=el("div","s",sub);s.style.margin="4px 0 0";c.appendChild(s)}return c}
function tag(m){var n=nilai(m);return el("span",n[1],n[0])}
async function load(){
var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(+per));
var q=db.from("permintaan").select("*").gte("dibuat",d.toISOString()).order("dibuat",{ascending:false}).limit(1000);
if(sel!=="all")q=q.eq("pulau_id",sel);
var all=(await q).data||[];
var w=all.filter(function(x){return x.status==="menunggu"}),p=all.filter(function(x){return x.status==="diambil"}),s=all.filter(function(x){return x.status==="selesai"});
var rs=all.filter(function(x){return x.diambil_pada}).map(resp);
var lb=all.filter(function(x){return resp(x)>LAMBAT}).length;
$("k1").textContent=w.length;$("k2").textContent=p.length;$("k3").textContent=s.length;
$("k4").textContent=rs.length?f(avg(rs))+" mnt":"-";
$("k5").textContent=rs.length?Math.round(rs.filter(function(m){return m<=CEPAT}).length/rs.length*100)+"%":"-";
$("k6").textContent=lb;
var A=$("act");A.innerHTML="";var live=w.concat(p);
if(!live.length)A.appendChild(el("div","card s","Tidak ada permintaan aktif. 👍"));
live.forEach(function(x){var m=Math.floor(mn(x.dibuat,new Date()));
var g=x.status==="menunggu"?el("span","tag"+(m>=LAMBAT?" red":""),"Menunggu "+m+" mnt"):el("span","tag g",(x.diambil_oleh||"")+" · "+m+" mnt");
A.appendChild(baris((brands[x.brand_id]||"Semua brand")+" · "+x.kebutuhan,0,g,(pulaus[x.pulau_id]||x.pulau_id)+(x.nama?" · "+x.nama:"")+(x.catatan?" · "+x.catatan:"")))});
var K={};all.filter(function(x){return x.diambil_oleh}).forEach(function(x){(K[x.diambil_oleh]=K[x.diambil_oleh]||[]).push(x)});
var KR=$("kar");KR.innerHTML="";var ks=Object.keys(K);
if(!ks.length)KR.appendChild(el("div","card s","Belum ada data."));
ks.sort(function(a,b){return avg(K[a].map(resp))-avg(K[b].map(resp))}).forEach(function(n){
var r=K[n].map(resp),a=avg(r),lt=r.filter(function(m){return m>LAMBAT}).length;
KR.appendChild(baris(n,0,tag(a),K[n].length+" layanan · rata-rata "+f(a)+" mnt · "+Math.round(r.filter(function(m){return m<=CEPAT}).length/r.length*100)+"% cepat · "+lt+" lambat"))});
var B={};all.forEach(function(x){var k=brands[x.brand_id]||"Semua brand";(B[k]=B[k]||[]).push(x)});
var BR=$("brd");BR.innerHTML="";
Object.keys(B).sort(function(a,b){return B[b].length-B[a].length}).forEach(function(k){var r=B[k].map(resp);
var rw=el("div","row");rw.style.padding="6px 0";rw.appendChild(el("span","",k));rw.appendChild(el("b","",B[k].length+" · "+f(avg(r))+" mnt"));BR.appendChild(rw)});
if(!all.length)BR.appendChild(el("span","s","Belum ada data."));
var H=$("his");H.innerHTML="";
all.filter(function(x){return x.status!=="menunggu"}).slice(0,15).forEach(function(x){var m=resp(x);
var t=new Date(x.dibuat).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
var sub=t+" · "+(x.diambil_oleh||"-")+" · respons "+f(m)+" mnt"+(x.selesai_pada&&x.diambil_pada?" · layanan "+f(mn(x.diambil_pada,x.selesai_pada))+" mnt":"");
H.appendChild(baris((brands[x.brand_id]||"Semua brand")+" · "+x.kebutuhan,0,tag(m),sub))})}
$("notif").onclick=async function(){try{await aktifkanPush(db,info());$("nst").textContent="✅ Notifikasi SPV aktif ("+(sel==="all"?"semua pulau":pulaus[sel])+")."}catch(e){$("nst").textContent="⚠️ "+e.message}};
async function init(){
var pl=await db.from("pulau").select("id,nama").order("id");
var o0=el("option","","Semua pulau");o0.value="all";$("pl").appendChild(o0);
(pl.data||[]).forEach(function(x){pulaus[x.id]=x.nama;var o=el("option","",x.nama);o.value=x.id;$("pl").appendChild(o)});
$("pl").value=sel;$("pr").value=per;
$("pl").onchange=function(){sel=$("pl").value;localStorage.setItem("spv_pulau",sel);load();segarkanPush(db,info())};
$("pr").onchange=function(){per=$("pr").value;localStorage.setItem("spv_per",per);load()};
var b=await db.from("brand").select("id,nama");(b.data||[]).forEach(function(x){brands[x.id]=x.nama});
if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone)$("nst").textContent="iPhone: tekan Bagikan lalu Add to Home Screen, kemudian buka dari ikonnya.";
else if(await segarkanPush(db,info()))$("nst").textContent="✅ Notifikasi SPV aktif ("+(sel==="all"?"semua pulau":pulaus[sel])+").";
await load();
db.channel("spv").on("postgres_changes",{event:"*",schema:"public",table:"permintaan"},load).subscribe();
setInterval(load,10000)}
init();
</script></body></html>
