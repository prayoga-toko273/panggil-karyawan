<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASK MATAHARI SKA · Karyawan</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MDS SKA">
<meta name="theme-color" content="#ea0029">
<link rel="stylesheet" href="style.css">
<style>select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.foto{width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin:0 0 10px;display:block}</style>
</head><body><main>
<h1>ASK MATAHARI SKA · Karyawan</h1>
<label for="me" style="margin-top:8px">Nama-NIK Anda</label>
<input id="me" placeholder="Contoh: Rina-1023" autocomplete="off">
<label>World tempat Anda bertugas</label>
<p class="s" style="font-size:14px;margin:0 0 6px">Boleh pilih lebih dari satu. Kosongkan semua untuk menerima semua World.</p>
<div id="wd" class="chips" style="flex-wrap:wrap;overflow:visible"></div>
<div id="alarmbar" class="card hide" style="background:#ea0029;border:0;text-align:center;margin-top:12px"><b style="color:#fff;font-size:20px">🔔 ADA PELANGGAN MENUNGGU!</b><br><button class="btn sm" id="diam" style="margin-top:8px;background:#fff;color:#ea0029">Diamkan 1 menit</button></div>
<button class="btn" id="notif" style="margin:14px 0 6px">🔔 Aktifkan notifikasi</button>
<button class="btn" id="suara" style="margin:0 0 6px;background:var(--card);color:var(--tx);border:1px solid var(--bd)">🔊 Aktifkan suara alarm di aplikasi</button>
<p class="s" id="nst" style="font-size:14px">Isi nama dan pilih World, lalu tekan Aktifkan notifikasi. Anda hanya menerima panggilan untuk World yang dipilih.</p>
<p class="s" id="onl" style="font-size:14px;font-weight:600"></p>
<div id="list"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="push.js"></script>
<script>
var db=supabase.createClient(CFG.url,CFG.key);
var $=function(x){return document.getElementById(x)};
var worldSel=[];try{worldSel=JSON.parse(localStorage.getItem("worlds")||"null")||(localStorage.getItem("world")&&localStorage.getItem("world")!=="all"?[localStorage.getItem("world")]:[])}catch(e){}
var ready=false,ch=null,iv=null,lastBeep=0,worlds={},brands={},pulaus={};
$("me").value=localStorage.getItem("nama")||"";
var devId=localStorage.getItem("devid");if(!devId){devId="d"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("devid",devId)}
var pv=null,hiddenAt=0;
// online = aplikasi ini sedang terbuka. Sinyal dikirim tiap 45 detik; berhenti sendiri saat halaman ditutup atau disembunyikan.
function ping(){if(document.visibilityState!=="visible"||!ready)return;var i=info();
if(!i.nama){$("onl").textContent="Isi Nama-NIK agar tercatat online.";return}
db.rpc("ping_online",{p_id:devId,p_nama:i.nama,p_world:i.world}).then(function(r){if(r&&r.data===true)$("onl").textContent="🟢 Anda tercatat online selama halaman ini terbuka."}).catch(function(){})}
function wname(){return worldSel.length?worldSel.map(function(i){return worlds[i]||i}).join(", "):"semua World"}
function info(){return {nama:$("me").value.trim(),peran:"staff",world:worldSel.length?worldSel.join(","):null}}
$("me").onchange=function(){localStorage.setItem("nama",$("me").value.trim());segarkanPush(db,info());ping()};
var alarm=new Audio("suara-notifikasi-ask.mp3");alarm.loop=true;alarm.preload="auto";
var alarmOn=localStorage.getItem("alarm_on")==="1",diamSampai=0,unlocked=false;
function unlock(){if(unlocked||!alarmOn)return;alarm.play().then(function(){alarm.pause();alarm.currentTime=0;unlocked=true}).catch(function(){})}
document.addEventListener("pointerdown",unlock);
function setSuara(){$("suara").textContent=alarmOn?"🔊 Suara alarm AKTIF (ketuk untuk mematikan)":"🔊 Aktifkan suara alarm di aplikasi"}
$("suara").onclick=function(){alarmOn=!alarmOn;localStorage.setItem("alarm_on",alarmOn?"1":"0");if(alarmOn)unlock();else alarm.pause();setSuara()};
$("diam").onclick=function(){diamSampai=Date.now()+60000;alarm.pause()};
function atur(ada){var bunyi=ada&&alarmOn&&Date.now()>diamSampai&&document.visibilityState==="visible";
$("alarmbar").classList.toggle("hide",!ada);
if(bunyi){alarm.play().catch(function(){})}else alarm.pause();
if(ada)try{navigator.vibrate&&navigator.vibrate([600,200,600])}catch(e){}}
function beep(){try{navigator.vibrate&&navigator.vibrate([300,100,300]);var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(function(){o.stop()},350)}catch(e){}}
function mnt(t){var m=Math.floor((Date.now()-new Date(t))/60000);return m<1?"baru saja":m+" menit lalu"}
$("notif").onclick=async function(){
var i=info();if(!i.nama){alert("Isi Nama-NIK Anda dulu.");return}
localStorage.setItem("nama",i.nama);
try{await aktifkanPush(db,i);$("nst").textContent="✅ Notifikasi aktif untuk "+wname()+"."}
catch(e){$("nst").textContent="⚠️ "+e.message}};
async function load(){
var q=db.from("permintaan").select("id,pulau_id,brand_id,world_id,kebutuhan,catatan,nama,foto_url,status,diambil_oleh,dibuat").in("status",["menunggu","diambil"]).order("dibuat",{ascending:false}).limit(50);
if(worldSel.length)q=q.in("world_id",worldSel);
var r=await q,rows=r.data||[];
var ada=rows.some(function(x){return x.status==="menunggu"});atur(ada);if(ada&&!alarmOn&&Date.now()-lastBeep>20000){lastBeep=Date.now();beep()}
var L=$("list");L.innerHTML="";
if(!rows.length){L.innerHTML='<div class="card s">Belum ada permintaan untuk '+wname()+'.</div>';return}
rows.forEach(function(x){
var c=document.createElement("div");c.className="card";
if(x.foto_url){var im=document.createElement("img");im.className="foto";im.loading="lazy";im.src=x.foto_url;im.alt="Foto barang dari pelanggan";im.onclick=function(){window.open(x.foto_url,"_blank")};c.appendChild(im)}
var t=document.createElement("div");t.className="row";
var b=document.createElement("b");b.textContent=(brands[x.brand_id]||"Semua brand")+" · "+x.kebutuhan;
var g=document.createElement("span");g.className="tag"+(x.status==="diambil"?" g":"");g.textContent=x.status==="diambil"?"Diambil: "+(x.diambil_oleh||""):"Menunggu";
t.appendChild(b);t.appendChild(g);
var d=document.createElement("div");d.className="s";d.style.margin="4px 0 10px";
d.textContent=(pulaus[x.pulau_id]||"")+" · "+mnt(x.dibuat)+(x.nama?" · "+x.nama:"")+(x.catatan?" · "+x.catatan:"");
c.appendChild(t);c.appendChild(d);
var btn=document.createElement("button");
if(x.status==="menunggu"){btn.className="btn sm";btn.textContent="Ambil";btn.onclick=async function(){
var n=$("me").value.trim();if(!n){alert("Isi Nama-NIK Anda dulu.");return}
btn.disabled=true;var r=await db.rpc("ambil_permintaan",{p_id:x.id,p_nama:n});
if(r.data!==true)alert("Sudah diambil karyawan lain.");load()}}
else{btn.className="btn sm ok";btn.textContent="Selesai";btn.onclick=async function(){btn.disabled=true;await db.rpc("selesai_permintaan",{p_id:x.id});load()}}
c.appendChild(btn);L.appendChild(c)})}
function conn(){
if(!ch){var o={event:"*",schema:"public",table:"permintaan"};if(worldSel.length)o.filter="world_id=in.("+worldSel.join(",")+")";
ch=db.channel("staff-"+worldSel.join("-")).on("postgres_changes",o,function(m){if(m.eventType==="INSERT")beep();load()}).subscribe()}
if(!iv)iv=setInterval(load,30000);
if(!pv){ping();pv=setInterval(ping,45000)}}
function disc(){if(ch){db.removeChannel(ch);ch=null}if(iv){clearInterval(iv);iv=null}if(pv){clearInterval(pv);pv=null}}
document.addEventListener("visibilitychange",function(){if(!ready)return;
if(document.visibilityState==="visible"){if(hiddenAt&&Date.now()-hiddenAt>1200000){location.reload();return}load();conn()}else{hiddenAt=Date.now();disc()}});
async function init(){setSuara();
var w=await db.from("world").select("id,nama");
(w.data||[]).sort(function(a,b){return (parseInt(a.id.slice(1))||0)-(parseInt(b.id.slice(1))||0)}).forEach(function(x){worlds[x.id]=x.nama});
worldSel=worldSel.filter(function(i){return worlds[i]});
function gambarWorld(){var h=$("wd");h.innerHTML="";Object.keys(worlds).forEach(function(id){var b=document.createElement("button");b.textContent=worlds[id];b.className=worldSel.indexOf(id)>=0?"on":"";
b.onclick=function(){var i=worldSel.indexOf(id);if(i>=0)worldSel.splice(i,1);else worldSel.push(id);localStorage.setItem("worlds",JSON.stringify(worldSel));gambarWorld();disc();load();if(document.visibilityState==="visible")conn();
if($("me").value.trim())segarkanPush(db,info()).then(function(ok){if(ok)$("nst").textContent="✅ Notifikasi aktif untuk "+wname()+"."})};h.appendChild(b)})}
gambarWorld();
var b=await db.from("brand").select("id,nama");(b.data||[]).forEach(function(x){brands[x.id]=x.nama});
var p=await db.from("pulau").select("id,nama,lantai");(p.data||[]).forEach(function(x){pulaus[x.id]=(x.lantai?"L"+x.lantai+" ":"")+x.nama});
ready=true;await load();
if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone)$("nst").textContent="iPhone: tekan tombol Bagikan lalu Add to Home Screen, kemudian buka aplikasi dari ikonnya di layar utama.";
else if($("me").value.trim()&&await segarkanPush(db,info()))$("nst").textContent="✅ Notifikasi aktif untuk "+wname()+".";
if(document.visibilityState==="visible")conn()}
init();
</script></body></html>
